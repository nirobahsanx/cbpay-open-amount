<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>USDT Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .payment-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    p {
      text-align: center;
      color: #666;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="payment-box">

  <h1>Pay with CBPay</h1>

  <p>Enter the amount you want to pay</p>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount in USDT"
    min="0.01"
    step="0.01"
  >

  <button id="payButton" onclick="createPayment()">
    Continue to Payment
  </button>

  <div id="message"></div>

</div>

<script>

async function createPayment() {

  const amount = document.getElementById("amount").value;
  const button = document.getElementById("payButton");
  const message = document.getElementById("message");

  if (!amount || Number(amount) <= 0) {
    message.innerText = "Please enter a valid amount.";
    return;
  }

  button.disabled = true;
  button.innerText = "Creating payment...";
  message.innerText = "";

  try {

    const response = await fetch("/create-payment", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        amount: amount
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "Unable to create payment"
      );
    }

    const paymentUrl =
      data.url ||
      data.payment_url ||
      data.checkout_url;

    if (!paymentUrl) {
      throw new Error("Payment URL was not returned.");
    }

    window.location.href = paymentUrl;

  } catch (error) {

    console.error(error);

    message.innerText =
      "Payment could not be created: "
